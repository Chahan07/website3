<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #212121;
      color: white;
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background: #171717;
      padding: 20px;
    }

    .sidebar h2 {
      margin-bottom: 20px;
    }

    .new-chat {
      width: 100%;
      padding: 12px;
      background: #2f2f2f;
      border: 1px solid #555;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px 25px;
      border-bottom: 1px solid #444;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
    }

    .message {
      max-width: 800px;
      margin: 0 auto 25px auto;
      padding: 15px 20px;
      border-radius: 10px;
      line-height: 1.5;
    }

    .user {
      background: #343541;
    }

    .bot {
      background: #444654;
    }

    .input-area {
      padding: 20px;
      background: #212121;
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #2f2f2f;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 8px;
      background: #10a37f;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0d8f70;
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <h2>My AI</h2>
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
  </aside>

  <main class="main">

    <header class="header">
      My AI Assistant
    </header>

    <div id="chat">
      <div class="message bot">
        Hello! I'm your AI assistant. How can I help you?
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <input
          id="messageInput"
          type="text"
          placeholder="Message My AI..."
          onkeydown="handleKey(event)"
        >

        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

  </main>

  <script>
    function handleKey(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (!message) return;

      // Show user's message
      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;

      chat.appendChild(userMessage);

      input.value = "";

      // Temporary loading message
      const botMessage = document.createElement("div");
      botMessage.className = "message bot";
      botMessage.textContent = "Thinking...";

      chat.appendChild(botMessage);

      chat.scrollTop = chat.scrollHeight;

      try {

        const response = await fetch("/api/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        botMessage.textContent = data.reply;

      } catch (error) {

        botMessage.textContent =
          "Sorry, something went wrong.";

        console.error(error);
      }

      chat.scrollTop = chat.scrollHeight;
    }

    function newChat() {
      document.getElementById("chat").innerHTML = `
        <div class="message bot">
          New conversation started. How can I help?
        </div>
      `;
    }
  </script>

</body>
</html>
